<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨墨音乐日志</title>
<style>
  :root {
    --bg: #08080a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  /* Ambient background glow */
  .ambient {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #1a1a2e20 0%, transparent 70%);
    pointer-events: none;
  }

  /* Main scene */
  .scene {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  /* Vinyl container */
  .vinyl-wrapper {
    position: relative;
    width: 320px;
    height: 320px;
  }

  /* The vinyl disc */
  .vinyl {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      #1a1a1a 0deg 2deg, #252525 2deg 4deg, #1a1a1a 4deg 6deg, #252525 6deg 8deg,
      #1a1a1a 8deg 10deg, #252525 10deg 12deg, #1a1a1a 12deg 14deg, #252525 14deg 16deg,
      #1a1a1a 16deg 18deg, #252525 18deg 20deg, #1a1a1a 20deg 22deg, #252525 22deg 24deg,
      #1a1a1a 24deg 26deg, #252525 26deg 28deg, #1a1a1a 28deg 30deg
    );
    background-size: 100% 100%;
    box-shadow:
      0 0 60px rgba(0,0,0,0.8),
      0 0 120px rgba(0,0,0,0.3),
      inset 0 0 40px rgba(0,0,0,0.5);
    animation: spin 8s linear infinite;
    animation-play-state: paused;
  }
  .vinyl.playing { animation-play-state: running; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Groove rings */
  .groove {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.03);
    pointer-events: none;
  }

  /* Album cover in center */
  .cover {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 140px;
    height: 140px;
    border-radius: 50%;
    overflow: hidden;
    z-index: 2;
    box-shadow:
      0 0 0 3px #1a1a1a,
      0 0 0 6px #111,
      0 0 0 8px #1a1a1a,
      0 0 30px rgba(0,0,0,0.6);
  }
  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Center hole */
  .hole {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #08080a;
    z-index: 3;
    box-shadow: 0 0 0 2px #222;
  }

  /* Reflection/shine */
  .shine {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(
      135deg,
      rgba(255,255,255,0.04) 0%,
      transparent 40%,
      transparent 60%,
      rgba(255,255,255,0.02) 100%
    );
    pointer-events: none;
    z-index: 4;
  }

  /* Info below vinyl */
  .info {
    text-align: center;
    color: #888;
    transition: opacity 0.5s;
  }
  .info .album-name {
    font-size: 16px;
    color: #ccc;
    font-weight: 500;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .info .artist-name {
    font-size: 13px;
    color: #666;
  }
  .info .label {
    font-size: 10px;
    color: #444;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 6px;
  }

  /* Play button */
  .play-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid #444;
    background: transparent;
    color: #888;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }
  .play-btn:hover {
    border-color: #e8b44f;
    color: #e8b44f;
    box-shadow: 0 0 20px rgba(232,180,79,0.15);
  }

  /* Refresh hint */
  .refresh-hint {
    position: fixed;
    bottom: 24px;
    color: #333;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: color 0.3s;
    border: none;
    background: none;
    font-family: inherit;
  }
  .refresh-hint:hover { color: #666; }
</style>
</head>
<body>

<div class="ambient"></div>

<div class="scene">
  <div class="vinyl-wrapper">
    <div class="vinyl playing" id="vinyl">
      <!-- Groove rings -->
    </div>
    <div class="cover" id="cover">
      <img id="coverImg" src="" alt="">
    </div>
    <div class="hole"></div>
    <div class="shine"></div>
  </div>

  <div class="info" id="info">
    <div class="album-name" id="albumName"></div>
    <div class="artist-name" id="artistName"></div>
    <div class="label">今日唱片</div>
  </div>

  <button class="play-btn" id="playBtn" onclick="togglePlay()">
    <span id="playIcon">⏸</span>
  </button>
</div>

<button class="refresh-hint" onclick="pickRandom()">换一张唱片</button>

    cover: 'https://upload.wikimedia.org/wikipedia/en/1/1c/Aphex_Twin_-_Selected_Ambient_Works_85-92.png',
  },
];

let isPlaying = true;

function pickRandom() {
  const album = ALBUMS[Math.floor(Math.random() * ALBUMS.length)];

  // Fade out
  const info = document.getElementById('info');
  info.style.opacity = '0';

  setTimeout(() => {
    document.getElementById('coverImg').src = album.cover;
    document.getElementById('albumName').textContent = album.name;
    document.getElementById('artistName').textContent = album.artist;
    info.style.opacity = '1';
  }, 400);
}

function togglePlay() {
  const vinyl = document.getElementById('vinyl');
  const icon = document.getElementById('playIcon');
  isPlaying = !isPlaying;
  vinyl.classList.toggle('playing', isPlaying);
  icon.textContent = isPlaying ? '⏸' : '▶';
}

// Initial pick
pickRandom();

// Add groove rings dynamically
const vinyl = document.getElementById('vinyl');
const wrapper = document.querySelector('.vinyl-wrapper');
for (let i = 1; i <= 20; i++) {
  const groove = document.createElement('div');
  groove.className = 'groove';
  const size = 40 + i * 12;
  groove.style.width = size + 'px';
  groove.style.height = size + 'px';
  groove.style.left = (160 - size/2) + 'px';
  groove.style.top = (160 - size/2) + 'px';
  vinyl.appendChild(groove);
}

// Handle image load errors — pick another
document.getElementById('coverImg').onerror = function() {
  setTimeout(pickRandom, 500);
};
</script>
